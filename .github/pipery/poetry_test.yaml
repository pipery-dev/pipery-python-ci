name: poetry-package-manager
description: Verify the action works with a Poetry-based Python project.
source_path: test-project-poetry
inputs:
  project_path: test-project-poetry
  package_manager: poetry
  skip_sast: "true"
  skip_sca: "true"
  skip_release: "true"
  skip_versioning: "true"
  skip_reintegration: "true"
expect:
  log_path: pipery.jsonl
  success_values: [success, passed, ok, succeeded]
  required_fields:
    - name: event
      value: build
