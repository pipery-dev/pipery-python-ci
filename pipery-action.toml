owner = "pipery-dev"
action_name = "pipery-python-ci"
title = "Pipery Python CI"
description = "CI pipeline for Python: SAST, SCA, lint, build, test, versioning, packaging, release, reintegration"
marketplace_category = "continuous-integration"
author = "pipery-dev"
action_type = "composite"
default_branch = "main"
version = "1.1.0"
repository_visibility = "public"
icon = "assets/icon.png"
test_command = ""
test_project_path = "test-project"
test_project_input = "project_path"
test_log_path = "pipery.jsonl"
test_log_success_values = ["success", "succeeded", "passed", "ok"]
cleanup_paths = ["pipery.jsonl"]

[[inputs]]
name = "project_path"
description = "Path to the project source tree."
required = false
default = "."

[[inputs]]
name = "config_file"
description = "Path to pipery config file."
required = false
default = ".pipery/config.yaml"

[[inputs]]
name = "package_manager"
description = "Package manager: auto, setuptools, poetry, uv."
required = false
default = "auto"

[[inputs]]
name = "python_version"
description = "Python version to use."
required = false
default = "3.11"

[[inputs]]
name = "skip_sast"
description = "Skip SAST scan."
required = false
default = "false"

[[inputs]]
name = "skip_sca"
description = "Skip SCA scan."
required = false
default = "false"

[[inputs]]
name = "skip_lint"
description = "Skip lint step."
required = false
default = "false"

[[inputs]]
name = "skip_build"
description = "Skip build step."
required = false
default = "false"

[[inputs]]
name = "tests_path"
description = "Path passed to pytest (directory, file, or nodeids). Defaults to project_path."
required = false
default = ""

[[inputs]]
name = "skip_test"
description = "Skip test step."
required = false
default = "false"

[[inputs]]
name = "skip_versioning"
description = "Skip versioning step."
required = false
default = "false"

[[inputs]]
name = "skip_packaging"
description = "Skip packaging step."
required = false
default = "false"

[[inputs]]
name = "skip_release"
description = "Skip release step."
required = false
default = "false"

[[inputs]]
name = "skip_reintegration"
description = "Skip reintegration step."
required = false
default = "false"

[[inputs]]
name = "version_bump"
description = "Version bump kind: patch, minor, major."
required = false
default = "patch"

[[inputs]]
name = "registry"
description = "Registry target for release."
required = false
default = "pypi"

[[inputs]]
name = "pypi_token"
description = "PyPI API token for publishing."
required = false
default = ""

[[inputs]]
name = "github_token"
description = "GitHub token for reintegration."
required = false
default = ""

[[inputs]]
name = "target_branch"
description = "Target branch for reintegration."
required = false
default = "main"

[[inputs]]
name = "log_file"
description = "Path to the JSONL log file."
required = false
default = "pipery.jsonl"

[[test_log_required_fields]]
name = "event"
value = "build"
