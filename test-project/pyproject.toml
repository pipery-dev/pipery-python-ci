[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-pipery"
version = "0.1.0"
description = "Test fixture for pipery-python-ci"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_pipery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
